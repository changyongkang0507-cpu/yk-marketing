<section class="section com-section" id="services"><div class="container"><h2>${t.services}</h2><div class="cards">${t.serviceNames.map((name,i)=>`<article class="service-card"><h3>${name}</h3><p>${t.sdesc[i]}</p><a class="btn btn-outline" href="#${['pricing','commerce','creator','influencer','editing','other'][i]}">↗ ${t.nav[0]}</a></article>`).join('')}</div><p>${t.platform}</p><div class="platforms">${['Facebook','Instagram','TikTok','Xiaohongshu / 小红书','Google Ads','Shopee','Lazada','TikTok Shop','YouTube'].map(s=>`<span>${s}</span>`).join('')}</div></div></section>
<section class="section dark-section" id="pricing"><div class="container"><div class="eyebrow">SOCIAL MEDIA</div><h2>${t.socialtitle}</h2><p class="muted">${t.socialnote}</p><div class="pricing">${plans.social.map(([id,name,price],i)=>`<article class="price-card ${i===1?'featured':''}"><div class="price-top">${name}</div><div class="price">RM${price.toLocaleString()} <small>${t.month}</small></div><ul><li>${i+1} ${t.videos}</li><li>${i+1} ${t.graphics}</li><li>${i+1} ${t.ads}</li><li>Facebook + Instagram</li></ul><button class="btn ${i===1?'btn-dark':'btn-primary'}" data-plan="${id}" data-service="social">${t.choose}</button></article>`).join('')}</div><p class="pricing-note">${t.adnote}</p><div class="scope-panel"><h3>${t.accountTitle}</h3><div class="scope-grid">${t.accountItems.map(([h,p])=>`<article><h4>${h}</h4><p>${p}</p></article>`).join('')}</div><p class="mini">${t.accountScope}</p></div></div></section>
<section class="section com-section" id="commerce"><div class="container"><div class="eyebrow">SHOPEE · LAZADA · TIKTOK SHOP</div><h2>${t.ecomtitle}</h2><p class="muted">${t.ecomnote}</p><div class="commerce">${plans.ecommerce.map(([id,name,price],i)=>`<article class="commerce-card"><span class="tag">${t.enames[i]}</span><div class="price">RM${price.toLocaleString()}</div><small>${i===0?t.once:t.perstore}</small><ul>${t.efeatures[i].map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn btn-dark" data-plan="${id}" data-service="ecommerce">${t.choose}</button></article>`).join('')}</div><p class="note">${t.enote}</p><div class="scope-panel light"><h3>${t.ecomTitle}</h3><div class="scope-grid">${t.ecomItems.map(([h,p])=>`<article><h4>${h}</h4><p>${p}</p></article>`).join('')}</div><p class="mini">${t.ecomScope}</p></div></div></section>
<section class="section" id="creator"><div class="container"><div class="eyebrow">CREATOR VISITS · PHOTO & VIDEO</div><h2>${t.creatorTitle}</h2><p class="section-intro">${t.creatorIntro}</p><aside class="creator-profiles"><h3>${t.profileHeading}</h3><p>${t.creatorBrandIntro}</p><div class="profile-links">${creatorProfiles.map(([label,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label} <span aria-hidden="true">↗</span></a>`).join('')}</div></aside><div class="creator-rates">${[['photo',t.photoLabel,150],['creatorVideo',t.videoLabel,200]].map(([id,name,price])=>`<article class="service-card"><span class="tag">${name}</span><div class="price">RM${price} <small>${t.shootUnit}</small></div><button class="btn btn-dark" data-service="creator" data-plan="${id}">${t.creatorChoose}</button></article>`).join('')}<article class="service-card timeline"><h3>${t.timelineTitle}</h3><p>${t.timeline}</p><p><strong>${t.transport}</strong></p><p>${t.urgent}</p></article></div><p class="note">${t.shootNote}</p></div></section>
<section class="section com-section" id="influencer"><div class="container"><div class="eyebrow">CREATOR CAMPAIGNS</div><h2>${t.influencerTitle}</h2><p class="section-intro">${t.influencerIntro}</p><div class="creator-steps">${t.influencerItems.map(([h,p],i)=>`<article class="service-card"><div class="eyebrow">0${i+1}</div><h3>${h}</h3><p>${p}</p></article>`).join('')}</div><p class="note">${t.influencerNote}</p><button class="btn btn-dark" data-service="influencer" data-plan="influencerCustom">${t.influencerChoose}</button></div></section>
<section class="section dark-section" id="editing"><div class="container editing-grid"><div><div class="eyebrow">VIDEO EDITING</div><h2>${t.editingTitle}</h2><p class="section-intro">${t.editingIntro}</p><span class="tag">${t.customPrice}</span></div><div class="editing-panel"><ul>${t.editingItems.map(p=>`<li>${p}</li>`).join('')}</ul><p class="mini">${t.editingNote}</p><button class="btn btn-primary" data-service="editing" data-plan="editingCustom">${t.editingChoose}</button></div></div></section>
<section class="section" id="extras"><div class="container"><h2>${t.extras}</h2><div class="addon-grid">${[300,50,300,50,250,300,300,150].map((p,i)=>`<div class="addon-row"><strong>${t.extraNames[i]}</strong><span>RM${p} ${t.units[i]}</span></div>`).join('')}</div><p class="note">${t.hostnote} ${t.adnote}</p><article id="other" class="service-card" style="margin-top:35px;background:var(--yellow)"><div class="eyebrow">BRAND COLLABORATIONS</div><h3>${t.other}</h3><p>${t.sdesc[5]}</p><button class="btn btn-dark" data-plan="custom" data-service="other">${t.custom} ↗</button></article></div></section>
<section class="section dark-section"><div class="container"><div class="eyebrow">HOW WE WORK</div><h2>${t.detailsTitle}</h2><div class="process-grid">${t.detailTitles.map((h,i)=>`<article><span class="tag">0${i+1}</span><h3>${h}</h3><p>${t.detailTexts[i]}</p></article>`).join('')}</div><div class="fit-panel"><h3>${t.fit}</h3><p>${t.fittext}</p><a class="btn btn-primary" href="#contact">${t.custom} ↗</a></div></div></section><section class="section com-section" id="portfolio"><div class="container"><div class="eyebrow">SELECTED WORK</div><h2>${t.casetitle}</h2><p class="muted">${t.casenote}</p><div class="filters" role="group" aria-label="Portfolio">${['all','ads','social','xhs','video'].map((f,i)=>`<button class="filter ${filter===f?'active':''}" aria-pressed="${filter===f}" data-filter="${f}">${t.filters[i]}</button>`).join('')}</div><div class="portfolio-grid" id="cases" style="margin-top:28px"></div></div></section>
<section class="section" id="contact"><div class="container"><div class="eyebrow">LET’S TALK</div><h2>${t.formtitle}</h2><p class="muted">${t.formintro}</p><form id="leadForm" class="contact-form"><div class="form-grid">${['company','name','phone'].map((id,i)=>`<div class="field"><label for="${id}">${t.fields[i]} *</label><input id="${id}" name="${id}" required maxlength="${id==='phone'?25:120}" ${id==='phone'?'type="tel" autocomplete="tel" pattern="[+0-9 ()-]{7,25}"':`autocomplete="${id==='company'?'organization':'name'}"`}></div>`).join('')}<div class="field"><label for="service">${t.fields[3]} *</label><select id="service" name="service" required><option value="">${t.select}</option><option value="social">Social Media</option><option value="ecommerce">E-Commerce</option><option value="creator">${t.serviceNames[2]}</option><option value="influencer">${t.serviceNames[3]}</option><option value="editing">${t.serviceNames[4]}</option><option value="other">${t.serviceNames[5]}</option></select></div><div class="field wide"><label for="package">${t.fields[4]} *</label><select id="package" name="package" required><option value="">${t.select}</option></select></div><div class="field wide"><label for="remark">${t.fields[5]}</label><textarea id="remark" name="remark" rows="4" maxlength="2000" placeholder="${t.remark}"></textarea></div><div class="wide"><p class="mini">${t.privacy}</p><button class="btn btn-dark" type="submit">${t.send}</button><p id="formStatus" role="status" aria-live="polite"></p></div></div></form></div></section></main><footer class="footer"><div class="container"><a class="brand" href="#home">YK Marketing.</a><p>${t.footer}</p><a href="https://wa.me/${PHONE}" target="_blank" rel="noopener">WhatsApp · 011-3681 6957 ↗</a><div class="bottom">© ${new Date().getFullYear()} YK Marketing</div></div></footer><a class="btn floating-wa" href="https://wa.me/${PHONE}" target="_blank" rel="noopener">WhatsApp ↗</a>`;
renderCases();bind();bindDropdowns();}
function renderCases(){const t=COPY[lang];$('cases').innerHTML=portfolio.map((p,i)=>({p,i})).filter(({p})=>filter==='all'||p.cat===filter).map(({p,i})=>{let desc=translateMetric(p.desc);if(p.safe)desc=lang==='zh'?'精选帖子浏览量。':'Tontonan post terpilih.';if(i===7)desc=lang==='zh'?'账号累计粉丝快照。':'Jumlah pengikut terkumpul.';const title=t.caseTitles[i]||t.video;return `<article class="work"><div class="case-result"><div class="eyebrow">${p.placeholder?'VIDEO PORTFOLIO':p.tag}</div><strong>${p.placeholder?'▷':esc(translateMetric(p.metric))}</strong><span>${p.placeholder?t.videonote:t.privacycase}</span></div><div class="work-body"><h3>${title}</h3>${!p.placeholder?`<p class="description">${esc(desc)}</p><p class="meta">${t.historic}</p>${p.cat==='xhs'?`<p class="meta">${i===14?'05 Oct–03 Nov 2026':i===15?'28 Oct–03 Nov 2026':t.unknown}</p>`:''}<p class="meta">${t.privacydesc}</p>`:`<p class="muted">${t.videonote}</p>`}</div></article>`}).join('')}
function updatePackages(value=''){const t=COPY[lang],service=$('service').value;$('package').innerHTML=`<option value="">${t.select}</option>`+(plans[service]||[]).map(([id,name,price],i)=>{const label=service==='ecommerce'?t.enames[i]:service==='creator'?(i===0?t.photoLabel:t.videoLabel):['influencer','editing','other'].includes(service)?t.customPrice:name;const unit=service==='creator'?t.shootUnit:id==='setup'?t.once:service==='ecommerce'?t.perstore:t.month;return `<option value="${id}">${label}${price?' — RM'+price.toLocaleString()+' '+unit:''}</option>`}).join('')+`<option value="discuss">${t.custom}</option>`;$('package').value=value;}
function bind(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const saved=$('leadForm')?Object.fromEntries(new FormData($('leadForm'))):null;lang=b.dataset.lang;try{localStorage.setItem('yk-language',lang)}catch{}render();if(saved){for(const k of ['company','name','phone','remark'])$(k).value=saved[k];$('service').value=saved.service;updatePackages(saved.package)}});document.querySelector('.menu-toggle').onclick=e=>{const on=$('navLinks').classList.toggle('show');e.currentTarget.setAttribute('aria-expanded',on)};document.querySelectorAll('#navLinks a').forEach(a=>a.onclick=()=>{$('navLinks').classList.remove('show');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});renderCases()});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{$('service').value=b.dataset.service;updatePackages(b.dataset.plan);$('contact').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});$('company').focus({preventScroll:true})});$('service').onchange=()=>updatePackages();$('leadForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));const t=COPY[lang];const lines=[lang==='zh'?'你好 YK Marketing，我想询问营销服务。':'Hai YK Marketing, saya berminat dengan servis pemasaran.',...['company','name','phone','service','package','remark'].map((k,i)=>t.fields[i]+': '+(k==='package'?$('package').selectedOptions[0].textContent:k==='service'?$('service').selectedOptions[0].textContent:data[k].trim()||'—'))];const url='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'));const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();$('formStatus').textContent=lang==='zh'?'请在 WhatsApp 按发送。如未打开，点击下面的链接。':'Tekan Hantar di WhatsApp. Jika belum terbuka, guna pautan di bawah.';const retry=document.createElement('a');retry.href=url;retry.target='_blank';retry.rel='noopener';retry.className='btn btn-outline';retry.textContent='WhatsApp ↗';$('formStatus').append(document.createElement('br'),retry);};}
function bindDropdowns(){const groups=[...document.querySelectorAll('.nav-group')];const close=g=>{g.querySelector('button').setAttribute('aria-expanded','false');g.querySelector('.nav-dropdown').hidden=true};const open=g=>{groups.filter(x=>x!==g).forEach(close);g.querySelector('button').setAttribute('aria-expanded','true');g.querySelector('.nav-dropdown').hidden=false};groups.forEach(g=>{const b=g.querySelector('button');b.onclick=()=>b.getAttribute('aria-expanded')==='true'?close(g):open(g);g.onmouseenter=()=>{if(matchMedia('(hover:hover)').matches)open(g)};g.onmouseleave=()=>{if(matchMedia('(hover:hover)').matches&&!g.contains(document.activeElement))close(g)};g.onfocusout=()=>setTimeout(()=>{if(!g.contains(document.activeElement))close(g)},0);g.onkeydown=e=>{if(e.key==='Escape'){close(g);b.focus()}if(e.key==='ArrowDown'&&e.target===b){e.preventDefault();open(g);g.querySelector('a').focus()}};g.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{if(a.dataset.caseFilter){filter=a.dataset.caseFilter;renderCases();document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x.dataset.filter===filter);x.setAttribute('aria-pressed',x.dataset.filter===filter)})}close(g)}))});document.onclick=e=>{if(!e.target.closest('.nav-group'))groups.forEach(close)}}
render();
</script></body></html>
