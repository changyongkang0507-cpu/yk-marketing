function translateMetric(text){const pairs=lang==='zh'?{'landing page views':'落地页浏览','page views':'专页浏览','link clicks':'链接点击','clicks':'点击','impressions':'展示','views':'浏览','followers':'粉丝','likes':'赞','accounts reached':'个账号触及','spent over':'花费，周期','spent':'花费','days':'天','per landing page view':'每次落地页浏览','campaign cost':'广告花费','average CPM':'平均千次展示费用','approx.':'约','viewers':'观看人数','interactions':'互动','visits':'访问','cover CTR':'封面点击率','average watch time':'平均观看时长'}:{'landing page views':'paparan halaman pendaratan','page views':'paparan halaman','link clicks':'klik pautan','clicks':'klik','impressions':'paparan iklan','views':'tontonan','followers':'pengikut','likes':'suka','accounts reached':'akaun dicapai','spent over':'dibelanjakan dalam','spent':'dibelanjakan','days':'hari','per landing page view':'setiap paparan halaman pendaratan','campaign cost':'kos kempen','average CPM':'purata CPM','approx.':'kira-kira','viewers':'penonton','interactions':'interaksi','visits':'lawatan','cover CTR':'CTR muka depan','average watch time':'purata masa tontonan'};for(const [a,b]of Object.entries(pairs))text=text.replaceAll(a,b);return text}
function render(){const t=COPY[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'ms';document.title='YK Marketing | '+(lang==='zh'?'社交媒体与电商营销':'Pemasaran Media Sosial & E-Dagang');$('app').innerHTML=`
<header class="nav"><div class="container nav-inner"><a class="brand" href="#home"><span>YK</span> Marketing.</a><nav class="nav-links" id="navLinks">${[['services',[[0,'pricing'],[1,'commerce'],[2,'other']]],['pricing',[[3,'pricing'],[4,'commerce'],[5,'extras']]],['portfolio',[[6,'portfolio','ads'],[7,'portfolio','social'],[8,'portfolio','xhs'],[9,'portfolio','video']]],['contact',[[10,'contact'],[11,'contact']]]].map(([id,links],i)=>`<div class="nav-group"><button type="button" class="nav-trigger" aria-expanded="false" aria-controls="menu-${id}">${t.nav[i]} <span aria-hidden="true">⌄</span></button><div class="nav-dropdown" id="menu-${id}" hidden>${links.map(([n,target,f])=>`<a href="#${target}" ${f?`data-case-filter="${f}"`:''}>${t.drop[n]} <span>↗</span></a>`).join('')}</div></div>`).join('')}</nav><div class="langs" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="${lang==='zh'}">中文</button><button type="button" data-lang="ms" aria-pressed="${lang==='ms'}">BM</button></div><button type="button" class="menu-toggle" aria-label="Menu" aria-expanded="false">☰</button></div></header>
<main><section class="hero" id="home"><div class="container hero-grid"><div><span class="tag">MALAYSIA · YK MARKETING</span><p class="eyebrow">${t.eyebrow}</p><h1>${t.hero}</h1><p>${t.intro}</p><div class="hero-actions"><a class="btn btn-primary" href="#pricing">${t.cta}</a><a class="btn btn-outline" style="color:white;border-color:#67806e" href="https://wa.me/${PHONE}" target="_blank" rel="noopener">${t.wa}</a></div></div><aside class="hero-results" aria-label="${t.proof}"><div class="eyebrow">SELECTED RESULTS</div><h2>${t.proof}</h2><div class="results-grid">${['3.9M','1,807','1,300','RM0.11'].map((v,i)=>`<div class="result"><strong>${v}</strong><p>${t.labels[i]}</p><small>${t.proofsub[i]}</small></div>`).join('')}</div><p class="mini">${t.proofnote}</p><a class="btn btn-primary" href="#portfolio">${t.nav[2]} ↗</a></aside></div></section>
<section class="section"><div class="container"><div class="eyebrow">YOUR NEXT STEP</div><h2>${t.pain}</h2><div class="cards">${t.pains.map((p,i)=>`<article class="service-card"><div class="eyebrow">0${i+1}</div><h3>${p[0]}</h3><p>${p[1]}</p></article>`).join('')}</div></div></section>
<section class="section com-section" id="services"><div class="container"><h2>${t.services}</h2><div class="cards">${['Social Media','E-Commerce','Other'].map((s,i)=>`<article class="service-card"><h3>${s}</h3><p>${t.sdesc[i]}</p><a class="btn btn-outline" href="#${['pricing','commerce','other'][i]}">↗ ${t.nav[0]}</a></article>`).join('')}</div><p>${t.platform}</p><div class="platforms">${['Facebook','Instagram','TikTok','Xiaohongshu / 小红书','Google Ads','Shopee','Lazada','TikTok Shop','YouTube'].map(s=>`<span>${s}</span>`).join('')}</div></div></section>
<section class="section dark-section" id="pricing"><div class="container"><div class="eyebrow">SOCIAL MEDIA</div><h2>${t.socialtitle}</h2><p class="muted">${t.socialnote}</p><div class="pricing">${plans.social.map(([id,name,price],i)=>`<article class="price-card ${i===1?'featured':''}"><div class="price-top">${name}</div><div class="price">RM${price.toLocaleString()} <small>${t.month}</small></div><ul><li>${i+1} ${t.videos}</li><li>${i+1} ${t.graphics}</li><li>${i+1} ${t.ads}</li><li>Facebook + Instagram</li></ul><button class="btn ${i===1?'btn-dark':'btn-primary'}" data-plan="${id}" data-service="social">${t.choose}</button></article>`).join('')}</div><p class="pricing-note">${t.adnote}</p></div></section>
<section class="section com-section" id="commerce"><div class="container"><div class="eyebrow">SHOPEE · LAZADA · TIKTOK SHOP</div><h2>${t.ecomtitle}</h2><p class="muted">${t.ecomnote}</p><div class="commerce">${plans.ecommerce.map(([id,name,price],i)=>`<article class="commerce-card"><span class="tag">${t.enames[i]}</span><div class="price">RM${price.toLocaleString()}</div><small>${i===0?t.once:t.perstore}</small><ul>${t.efeatures[i].map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn btn-dark" data-plan="${id}" data-service="ecommerce">${t.choose}</button></article>`).join('')}</div><p class="note">${t.enote}</p></div></section>
<section class="section" id="extras"><div class="container"><h2>${t.extras}</h2><div class="addon-grid">${[300,50,300,50,250,300,300,150].map((p,i)=>`<div class="addon-row"><strong>${t.extraNames[i]}</strong><span>RM${p} ${t.units[i]}</span></div>`).join('')}</div><p class="note">${t.hostnote} ${t.adnote}</p><article id="other" class="service-card" style="margin-top:35px;background:var(--yellow)"><div class="eyebrow">BRAND COLLABORATIONS</div><h3>${t.other}</h3><p>${t.network}</p><p>${t.sdesc[2]}</p><button class="btn btn-dark" data-plan="custom" data-service="other">${t.custom} ↗</button></article></div></section>
<section class="section dark-section"><div class="container"><div class="eyebrow">HOW WE WORK</div><h2>${t.detailsTitle}</h2><div class="process-grid">${t.detailTitles.map((h,i)=>`<article><span class="tag">0${i+1}</span><h3>${h}</h3><p>${t.detailTexts[i]}</p></article>`).join('')}</div><div class="fit-panel"><h3>${t.fit}</h3><p>${t.fittext}</p><a class="btn btn-primary" href="#contact">${t.custom} ↗</a></div></div></section><section class="section com-section" id="portfolio"><div class="container"><div class="eyebrow">SELECTED WORK</div><h2>${t.casetitle}</h2><p class="muted">${t.casenote}</p><div class="filters" role="group" aria-label="Portfolio">${['all','ads','social','xhs','video'].map((f,i)=>`<button class="filter ${filter===f?'active':''}" aria-pressed="${filter===f}" data-filter="${f}">${t.filters[i]}</button>`).join('')}</div><div class="portfolio-grid" id="cases" style="margin-top:28px"></div></div></section>
<section class="section" id="contact"><div class="container"><div class="eyebrow">LET’S TALK</div><h2>${t.formtitle}</h2><p class="muted">${t.formintro}</p><form id="leadForm" class="contact-form"><div class="form-grid">${['company','name','phone'].map((id,i)=>`<div class="field"><label for="${id}">${t.fields[i]} *</label><input id="${id}" name="${id}" required maxlength="${id==='phone'?25:120}" ${id==='phone'?'type="tel" autocomplete="tel" pattern="[+0-9 ()-]{7,25}"':`autocomplete="${id==='company'?'organization':'name'}"`}></div>`).join('')}<div class="field"><label for="service">${t.fields[3]} *</label><select id="service" name="service" required><option value="">${t.select}</option><option value="social">Social Media</option><option value="ecommerce">E-Commerce</option><option value="other">Other</option></select></div><div class="field wide"><label for="package">${t.fields[4]} *</label><select id="package" name="package" required><option value="">${t.select}</option></select></div><div class="field wide"><label for="remark">${t.fields[5]}</label><textarea id="remark" name="remark" rows="4" maxlength="2000" placeholder="${t.remark}"></textarea></div><div class="wide"><p class="mini">${t.privacy}</p><button class="btn btn-dark" type="submit">${t.send}</button><p id="formStatus" role="status" aria-live="polite"></p></div></div></form></div></section></main><footer class="footer"><div class="container"><a class="brand" href="#home">YK Marketing.</a><p>${t.footer}</p><a href="https://wa.me/${PHONE}" target="_blank" rel="noopener">WhatsApp · 011-3681 6957 ↗</a><div class="bottom">© ${new Date().getFullYear()} YK Marketing</div></div></footer><a class="btn floating-wa" href="https://wa.me/${PHONE}" target="_blank" rel="noopener">WhatsApp ↗</a>`;
renderCases();bind();bindDropdowns();}
function renderCases(){const t=COPY[lang];$('cases').innerHTML=portfolio.map((p,i)=>({p,i})).filter(({p})=>filter==='all'||p.cat===filter).map(({p,i})=>{let desc=translateMetric(p.desc);if(p.safe)desc=lang==='zh'?'精选帖子浏览量。':'Tontonan post terpilih.';if(i===7)desc=lang==='zh'?'账号累计粉丝快照。':'Jumlah pengikut terkumpul.';const title=t.caseTitles[i]||t.video;return `<article class="work"><div class="case-result"><div class="eyebrow">${p.placeholder?'VIDEO PORTFOLIO':p.tag}</div><strong>${p.placeholder?'▷':esc(translateMetric(p.metric))}</strong><span>${p.placeholder?t.videonote:t.privacycase}</span></div><div class="work-body"><h3>${title}</h3>${!p.placeholder?`<p class="description">${esc(desc)}</p><p class="meta">${t.historic}</p>${p.cat==='xhs'?`<p class="meta">${i===14?'05 Oct–03 Nov 2026':i===15?'28 Oct–03 Nov 2026':t.unknown}</p>`:''}<p class="meta">${t.privacydesc}</p>`:`<p class="muted">${t.videonote}</p>`}</div></article>`}).join('')}
function updatePackages(value=''){const t=COPY[lang],service=$('service').value;$('package').innerHTML=`<option value="">${t.select}</option>`+(plans[service]||[]).map(([id,name,price],i)=>`<option value="${id}">${service==='ecommerce'?t.enames[i]:name}${price?' — RM'+price.toLocaleString()+(id==='setup'?' '+t.once:' '+(service==='ecommerce'?t.perstore:t.month)):''}</option>`).join('')+`<option value="discuss">${t.custom}</option>`;$('package').value=value;}
function bind(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{const saved=$('leadForm')?Object.fromEntries(new FormData($('leadForm'))):null;lang=b.dataset.lang;try{localStorage.setItem('yk-language',lang)}catch{}render();if(saved){for(const k of ['company','name','phone','remark'])$(k).value=saved[k];$('service').value=saved.service;updatePackages(saved.package)}});document.querySelector('.menu-toggle').onclick=e=>{const on=$('navLinks').classList.toggle('show');e.currentTarget.setAttribute('aria-expanded',on)};document.querySelectorAll('#navLinks a').forEach(a=>a.onclick=()=>{$('navLinks').classList.remove('show');document.querySelector('.menu-toggle').setAttribute('aria-expanded','false')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});renderCases()});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{$('service').value=b.dataset.service;updatePackages(b.dataset.plan);$('contact').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});$('company').focus({preventScroll:true})});$('service').onchange=()=>updatePackages();$('leadForm').onsubmit=e=>{e.preventDefault();const form=e.currentTarget;if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));const t=COPY[lang];const lines=[lang==='zh'?'你好 YK Marketing，我想询问营销服务。':'Hai YK Marketing, saya berminat dengan servis pemasaran.',...['company','name','phone','service','package','remark'].map((k,i)=>t.fields[i]+': '+(k==='package'?$('package').selectedOptions[0].textContent:k==='service'?$('service').selectedOptions[0].textContent:data[k].trim()||'—'))];const url='https://wa.me/'+PHONE+'?text='+encodeURIComponent(lines.join('\n'));const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove();$('formStatus').textContent=lang==='zh'?'请在 WhatsApp 按发送。如未打开，点击下面的链接。':'Tekan Hantar di WhatsApp. Jika belum terbuka, guna pautan di bawah.';const retry=document.createElement('a');retry.href=url;retry.target='_blank';retry.rel='noopener';retry.className='btn btn-outline';retry.textContent='WhatsApp ↗';$('formStatus').append(document.createElement('br'),retry);};}
function bindDropdowns(){const groups=[...document.querySelectorAll('.nav-group')];const close=g=>{g.querySelector('button').setAttribute('aria-expanded','false');g.querySelector('.nav-dropdown').hidden=true};const open=g=>{groups.filter(x=>x!==g).forEach(close);g.querySelector('button').setAttribute('aria-expanded','true');g.querySelector('.nav-dropdown').hidden=false};groups.forEach(g=>{const b=g.querySelector('button');b.onclick=()=>b.getAttribute('aria-expanded')==='true'?close(g):open(g);g.onmouseenter=()=>{if(matchMedia('(hover:hover)').matches)open(g)};g.onmouseleave=()=>{if(matchMedia('(hover:hover)').matches&&!g.contains(document.activeElement))close(g)};g.onfocusout=()=>setTimeout(()=>{if(!g.contains(document.activeElement))close(g)},0);g.onkeydown=e=>{if(e.key==='Escape'){close(g);b.focus()}if(e.key==='ArrowDown'&&e.target===b){e.preventDefault();open(g);g.querySelector('a').focus()}};g.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{if(a.dataset.caseFilter){filter=a.dataset.caseFilter;renderCases();document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x.dataset.filter===filter);x.setAttribute('aria-pressed',x.dataset.filter===filter)})}close(g)}))});document.onclick=e=>{if(!e.target.closest('.nav-group'))groups.forEach(close)}}
render();
</script></body></html>
